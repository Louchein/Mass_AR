<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR App - AR.js Compatible</title>
    
    <!-- Usando AR.js en lugar de MindAR para mejor compatibilidad -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        
        #debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: #00ff00;
            padding: 15px;
            z-index: 1000;
            font-family: monospace;
            font-size: 10px;
            max-width: 90%;
            max-height: 40%;
            overflow-y: auto;
            border: 2px solid #00ff00;
        }
        
        #start-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            padding: 30px 40px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        #start-button:active {
            background-color: #45a049;
            transform: translate(-50%, -50%) scale(0.95);
        }
        
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: none;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .video-button {
            padding: 20px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: 2px solid white;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(0,0,0,0.7);
        }
        
        #button-a {
            background-color: rgba(255,107,107,0.9);
        }
        
        #button-b {
            background-color: rgba(78,205,196,0.9);
        }
        
        .video-button:active {
            transform: scale(0.9);
        }
        
        .video-button.selected {
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
            border-width: 4px;
        }
        
        #status {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            max-width: 40%;
            text-align: center;
        }

        .arjs-loader {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
        }
    </style>
  </head>
  
  <body style="margin: 0; overflow: hidden;">
    <!-- Loading Screen -->
    <div class="arjs-loader">
        <div>Cargando experiencia AR...<br>Por favor espera</div>
    </div>

    <!-- Debug Info Panel -->
    <div id="debug-info">
        🔍 DIAGNÓSTICO:<br>
        <div id="debug-log">Iniciando...<br></div>
    </div>

    <!-- Status Display -->
    <div id="status">Cargando...</div>

    <!-- Start Button -->
    <button id="start-button" style="display: none;">▶️ INICIAR VIDEOS</button>

    <!-- Control Buttons -->
    <div id="controls">
        <button id="button-a" class="video-button">VIDEO A</button>
        <button id="button-b" class="video-button">VIDEO B</button>
    </div>
    
    <!-- AR.js Scene con marker-based tracking -->
    <a-scene
        id="ar-scene"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: mediump;"
        loading-screen="enabled: false">
        
        <a-assets>
            <a-asset-item id="logoModel" src="./assets/logo.glb"></a-asset-item>
            
            <video 
                id="video-a" 
                src="./assets/Reel_BV_01.mp4" 
                preload="auto"
                webkit-playsinline 
                playsinline
                muted
                loop
                crossorigin="anonymous">
            </video>
            
            <video 
                id="video-b" 
                src="./assets/video.mp4" 
                preload="auto"
                webkit-playsinline 
                playsinline
                muted
                loop
                crossorigin="anonymous">
            </video>
        </a-assets>

        <a-camera gps-camera rotation-reader></a-camera>

        <!-- Marker 1: Hiro pattern (para modelo 3D) -->
        <a-marker preset="hiro" id="marker-hiro">
            <a-entity
                position="0 0 0"
                scale="0.5 0.5 0.5"
                rotation="-90 0 0"
                gltf-model="#logoModel"
                animation-mixer>
            </a-entity>
        </a-marker>

        <!-- Marker 2: Kanji pattern (para video) -->
        <a-marker preset="kanji" id="marker-kanji">
            <a-video
                id="video-display"
                src="#video-a"
                width="2"
                height="1.5"
                position="0 0.5 0"
                rotation="-90 0 0"
                visible="true">
            </a-video>
        </a-marker>

        <!-- Marker 3: Custom pattern (alternativa) -->
        <a-marker type="pattern" url="./assets/pattern-marker.patt" id="marker-custom">
            <a-video
                id="video-display-alt"
                src="#video-a"
                width="2"
                height="1.5"
                position="0 0.5 0"
                rotation="-90 0 0"
                visible="true">
            </a-video>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
      
    <script>
        // Logger helper
        var debugLog = document.getElementById('debug-log');
        function log(message) {
            console.log(message);
            var timestamp = new Date().toLocaleTimeString();
            debugLog.innerHTML += '[' + timestamp + '] ' + message + '<br>';
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        window.addEventListener('load', function() {
            log('✅ Página cargada');
            
            var sceneEl = document.getElementById('ar-scene');
            var videoA = document.getElementById('video-a');
            var videoB = document.getElementById('video-b');
            var videoDisplay = document.getElementById('video-display');
            var videoDisplayAlt = document.getElementById('video-display-alt');
            var startButton = document.getElementById('start-button');
            var buttonA = document.getElementById('button-a');
            var buttonB = document.getElementById('button-b');
            var status = document.getElementById('status');
            var controls = document.getElementById('controls');
            
            var currentVideo = null;
            var currentVideoType = 'a';
            var markerDetected = false;
            var videosReady = false;
            
            // Hide loading screen when AR is ready
            sceneEl.addEventListener('loaded', function() {
                log('✅ A-Frame cargado');
            });

            sceneEl.addEventListener('arjs-video-loaded', function() {
                log('✅ Cámara iniciada');
                document.querySelector('.arjs-loader').style.display = 'none';
                status.textContent = '📷 Apunta a un marcador AR';
                startButton.style.display = 'block';
            });

            // Check WebGL
            try {
                var canvas = document.createElement('canvas');
                var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    log('✅ WebGL disponible');
                } else {
                    log('❌ WebGL no disponible');
                }
            } catch(e) {
                log('❌ WebGL error: ' + e.message);
            }

            // Initialize videos on button click
            startButton.addEventListener('click', function() {
                log('🎬 Inicializando videos...');
                startButton.style.display = 'none';
                
                // Attempt to load and play videos silently
                videoA.load();
                videoB.load();
                
                // Try to play and pause to unlock autoplay
                var playPromiseA = videoA.play();
                if (playPromiseA !== undefined) {
                    playPromiseA.then(function() {
                        log('✅ Video A desbloqueado');
                        videoA.pause();
                        videoA.currentTime = 0;
                    }).catch(function(error) {
                        log('⚠️ Video A: ' + error.message);
                    });
                }
                
                var playPromiseB = videoB.play();
                if (playPromiseB !== undefined) {
                    playPromiseB.then(function() {
                        log('✅ Video B desbloqueado');
                        videoB.pause();
                        videoB.currentTime = 0;
                    }).catch(function(error) {
                        log('⚠️ Video B: ' + error.message);
                    });
                }
                
                videosReady = true;
                status.textContent = '✅ Videos listos - Apunta al marcador';
            });

            // Marker detection for Hiro (3D model)
            var markerHiro = document.getElementById('marker-hiro');
            markerHiro.addEventListener('markerFound', function() {
                log('🎯 Marcador HIRO detectado (3D)');
                status.textContent = '✅ Modelo 3D visible';
            });

            markerHiro.addEventListener('markerLost', function() {
                log('🔍 Marcador HIRO perdido');
                status.textContent = '📷 Buscar marcador...';
            });

            // Marker detection for Kanji (Video)
            var markerKanji = document.getElementById('marker-kanji');
            markerKanji.addEventListener('markerFound', function() {
                log('🎯 Marcador KANJI detectado (VIDEO)');
                markerDetected = true;
                controls.style.display = 'flex';
                status.textContent = '✅ Marcador detectado';
                
                if (videosReady && currentVideo) {
                    currentVideo.play().catch(function(e) {
                        log('⚠️ Error play: ' + e.message);
                    });
                }
            });

            markerKanji.addEventListener('markerLost', function() {
                log('🔍 Marcador KANJI perdido');
                markerDetected = false;
                controls.style.display = 'none';
                
                if (currentVideo) {
                    currentVideo.pause();
                }
            });

            // Custom marker (alternative)
            var markerCustom = document.getElementById('marker-custom');
            markerCustom.addEventListener('markerFound', function() {
                log('🎯 Marcador CUSTOM detectado');
                markerDetected = true;
                controls.style.display = 'flex';
                status.textContent = '✅ Marcador detectado';
            });

            markerCustom.addEventListener('markerLost', function() {
                log('🔍 Marcador CUSTOM perdido');
                markerDetected = false;
                controls.style.display = 'none';
            });

            // Play video function
            function playVideo(type) {
                log('▶️ Cambiando a video: ' + type);
                
                if (!videosReady) {
                    log('⚠️ Videos no listos');
                    status.textContent = 'Primero presiona INICIAR';
                    startButton.style.display = 'block';
                    return;
                }

                if (!markerDetected) {
                    log('⚠️ Marcador no detectado');
                    status.textContent = 'Apunta al marcador primero';
                    return;
                }

                // Stop current video
                if (currentVideo) {
                    currentVideo.pause();
                    currentVideo.currentTime = 0;
                }

                // Set new video
                if (type === 'a') {
                    currentVideo = videoA;
                    currentVideoType = 'a';
                    videoDisplay.setAttribute('src', '#video-a');
                    videoDisplayAlt.setAttribute('src', '#video-a');
                    buttonA.classList.add('selected');
                    buttonB.classList.remove('selected');
                } else {
                    currentVideo = videoB;
                    currentVideoType = 'b';
                    videoDisplay.setAttribute('src', '#video-b');
                    videoDisplayAlt.setAttribute('src', '#video-b');
                    buttonA.classList.remove('selected');
                    buttonB.classList.add('selected');
                }

                // Play video
                currentVideo.play().then(function() {
                    log('✅ Video ' + type.toUpperCase() + ' reproduciendo');
                    status.textContent = '▶️ Video ' + type.toUpperCase();
                }).catch(function(error) {
                    log('❌ Error al reproducir: ' + error.message);
                    status.textContent = 'Error: ' + error.message;
                });
            }

            // Button handlers
            buttonA.addEventListener('click', function() { playVideo('a'); });
            buttonB.addEventListener('click', function() { playVideo('b'); });

            // Video error handling
            videoA.addEventListener('error', function(e) {
                log('❌ Video A error code: ' + (videoA.error ? videoA.error.code : 'unknown'));
            });

            videoB.addEventListener('error', function(e) {
                log('❌ Video B error code: ' + (videoB.error ? videoB.error.code : 'unknown'));
            });

            // Set default video
            currentVideo = videoA;
            buttonA.classList.add('selected');

            log('✅ Sistema listo');
            status.textContent = 'Esperando cámara...';
        });
    </script>
  </body>
</html>
