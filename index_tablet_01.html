<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR App - Android Compatible</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        
        #debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: #00ff00;
            padding: 15px;
            z-index: 1000;
            font-family: monospace;
            font-size: 10px;
            max-width: 90%;
            max-height: 40%;
            overflow-y: auto;
            border: 2px solid #00ff00;
        }
        
        #start-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            padding: 30px 40px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        #start-button:active {
            background-color: #45a049;
            transform: translate(-50%, -50%) scale(0.95);
        }

        #start-button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: none;
            gap: 15px;
        }
        
        .video-button {
            padding: 20px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: 2px solid white;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(0,0,0,0.7);
        }
        
        #button-a {
            background-color: rgba(255,107,107,0.9);
        }
        
        #button-b {
            background-color: rgba(78,205,196,0.9);
        }
        
        .video-button:active {
            transform: scale(0.9);
        }
        
        .video-button.selected {
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
            border-width: 4px;
        }
        
        #status {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            max-width: 80%;
            text-align: center;
        }

        #error-details {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            max-width: 90%;
            display: none;
        }
    </style>
  </head>
  
  <body>
    <!-- Debug Info Panel -->
    <div id="debug-info">
        🔍 DIAGNÓSTICO COMPLETO:<br>
        <div id="debug-log">Iniciando diagnóstico...<br></div>
    </div>

    <!-- Status Display -->
    <div id="status">Presiona el botón para iniciar</div>

    <!-- Error Details -->
    <div id="error-details"></div>

    <!-- Start Button -->
    <button id="start-button">▶️ INICIAR AR</button>

    <!-- Control Buttons -->
    <div id="controls">
        <button id="button-a" class="video-button">VIDEO A</button>
        <button id="button-b" class="video-button">VIDEO B</button>
    </div>
    
    <a-scene 
        id="ar-scene"
        mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 2; autoStart: false; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 5"
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true, antialias: false, precision: mediump"
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: true"
        embedded
        loading-screen="enabled: false"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%;">
      
      <a-assets timeout="30000">
        <a-asset-item id="animatedLogoModel" src="./assets/logo.glb"></a-asset-item>
        
        <video 
            id="video-a" 
            src="./assets/Reel_BV_01.mp4" 
            preload="metadata"
            webkit-playsinline 
            playsinline
            muted
            crossorigin="anonymous">
        </video>
        
        <video 
            id="video-b" 
            src="./assets/video.mp4" 
            preload="metadata"
            webkit-playsinline 
            playsinline
            muted
            crossorigin="anonymous">
        </video>
      </a-assets>
      
      <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
      
      <!-- 3D Model Entity (Target Index 1) -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model 
            rotation="90 -90 -90" 
            position="0 0 0" 
            scale="7 7 7" 
            src="#animatedLogoModel" 
            animation-mixer>
        </a-gltf-model>
      </a-entity>
      
      <!-- Video Display (Target Index 0) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video 
          id="video-display"
          src="#video-a" 
          width="3" 
          height="1.5" 
          position="0 0 0" 
          rotation="0 0 0"
          visible="false">
        </a-video>
      </a-entity>
    </a-scene>
      
    <script>
        // Polyfill para Promise.allSettled
        if (!Promise.allSettled) {
            Promise.allSettled = function(promises) {
                return Promise.all(promises.map(function(p) {
                    return Promise.resolve(p).then(
                        function(value) { return { status: 'fulfilled', value: value }; },
                        function(reason) { return { status: 'rejected', reason: reason }; }
                    );
                }));
            };
        }

        // Logger helper
        var debugLog = document.querySelector('#debug-log');
        function log(message) {
            console.log(message);
            var timestamp = new Date().toLocaleTimeString();
            debugLog.innerHTML += '[' + timestamp + '] ' + message + '<br>';
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        document.addEventListener('DOMContentLoaded', function() {
            log('DOM Cargado');
            
            var sceneEl = document.querySelector('a-scene');
            var videoA = document.querySelector('#video-a');
            var videoB = document.querySelector('#video-b');
            var videoDisplay = document.querySelector('#video-display');
            var startButton = document.querySelector('#start-button');
            var buttonA = document.querySelector('#button-a');
            var buttonB = document.querySelector('#button-b');
            var status = document.querySelector('#status');
            var controls = document.querySelector('#controls');
            var errorDetails = document.querySelector('#error-details');
            
            var currentVideo = null;
            var currentVideoType = null;
            var isTargetDetected = false;
            var isSystemReady = false;
            
            // Detect device info
            var ua = navigator.userAgent;
            log('UserAgent: ' + ua);
            
            // Check WebGL
            try {
                var canvas = document.createElement('canvas');
                var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    var glInfo = {
                        version: gl.getParameter(gl.VERSION),
                        vendor: gl.getParameter(gl.VENDOR),
                        renderer: gl.getParameter(gl.RENDERER)
                    };
                    log('✅ WebGL OK: ' + glInfo.renderer);
                } else {
                    log('❌ WebGL NO disponible');
                    showError('WebGL no está disponible en este dispositivo');
                }
            } catch(e) {
                log('❌ WebGL Error: ' + e.message);
                showError('Error al verificar WebGL: ' + e.message);
            }
            
            // Check camera
            log('Verificando cámara...');
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                log('✅ API getUserMedia disponible');
            } else {
                log('❌ API getUserMedia NO disponible');
                showError('Tu navegador no soporta acceso a cámara');
            }

            // Check if targets.mind exists
            log('Verificando archivo targets.mind...');
            fetch('./assets/targets.mind')
                .then(function(response) {
                    log('✅ targets.mind: ' + response.status + ' - ' + response.statusText);
                    return response.arrayBuffer();
                })
                .then(function(buffer) {
                    log('✅ targets.mind cargado: ' + buffer.byteLength + ' bytes');
                })
                .catch(function(error) {
                    log('❌ targets.mind ERROR: ' + error.message);
                    showError('No se encuentra el archivo targets.mind en ./assets/');
                });
            
            function showError(msg) {
                errorDetails.textContent = '❌ ERROR: ' + msg;
                errorDetails.style.display = 'block';
            }

            function hideError() {
                errorDetails.style.display = 'none';
            }
            
            // Wait for A-Frame to be ready
            sceneEl.addEventListener('loaded', function() {
                log('✅ A-Frame scene cargado');
            });

            // Start AR System with timeout
            startButton.addEventListener('click', function() {
                log('🎬 Usuario presionó INICIAR');
                startButton.disabled = true;
                startButton.textContent = '⏳ Iniciando...';
                status.textContent = 'Iniciando sistema AR...';
                hideError();
                
                // Set a timeout to detect if start hangs
                var startTimeout = setTimeout(function() {
                    log('⚠️ TIMEOUT: MindAR no respondió en 15 segundos');
                    showError('Timeout: MindAR no pudo iniciar. Posibles causas: archivo targets.mind corrupto, incompatibilidad de dispositivo, o problema de red.');
                    startButton.disabled = false;
                    startButton.textContent = '🔄 REINTENTAR';
                    status.textContent = '❌ Error de timeout';
                }, 15000);
                
                log('Llamando a mindar-image-system.start()...');
                
                // Try to start MindAR
                try {
                    var mindARSystem = sceneEl.systems['mindar-image-system'];
                    
                    if (!mindARSystem) {
                        clearTimeout(startTimeout);
                        log('❌ Sistema mindar-image-system no encontrado');
                        showError('Sistema MindAR no se inicializó correctamente');
                        startButton.disabled = false;
                        startButton.textContent = '🔄 REINTENTAR';
                        return;
                    }
                    
                    log('Sistema MindAR encontrado, iniciando...');
                    
                    mindARSystem.start().then(function() {
                        clearTimeout(startTimeout);
                        log('✅ MindAR iniciado exitosamente');
                        startButton.style.display = 'none';
                        status.textContent = '✅ Apunta la cámara al marcador';
                        isSystemReady = true;
                        
                        loadVideos();
                    }).catch(function(error) {
                        clearTimeout(startTimeout);
                        log('❌ MindAR error: ' + error.message);
                        log('Error stack: ' + (error.stack || 'No stack available'));
                        showError('MindAR falló: ' + error.message);
                        startButton.disabled = false;
                        startButton.textContent = '🔄 REINTENTAR';
                        status.textContent = '❌ Error al iniciar AR';
                    });
                } catch(error) {
                    clearTimeout(startTimeout);
                    log('❌ Exception al iniciar: ' + error.message);
                    log('Exception stack: ' + (error.stack || 'No stack available'));
                    showError('Excepción: ' + error.message);
                    startButton.disabled = false;
                    startButton.textContent = '🔄 REINTENTAR';
                }
            });
            
            // Load videos
            function loadVideos() {
                log('Cargando videos...');
                
                videoA.addEventListener('loadedmetadata', function() {
                    log('✅ Video A metadata: ' + videoA.duration + 's');
                });
                
                videoB.addEventListener('loadedmetadata', function() {
                    log('✅ Video B metadata: ' + videoB.duration + 's');
                });
                
                videoA.addEventListener('error', function(e) {
                    log('❌ Video A error: ' + (videoA.error ? videoA.error.code : 'unknown'));
                });
                
                videoB.addEventListener('error', function(e) {
                    log('❌ Video B error: ' + (videoB.error ? videoB.error.code : 'unknown'));
                });
                
                videoA.load();
                videoB.load();
            }
            
            // Target detection
            sceneEl.addEventListener('targetFound', function(event) {
                var targetIndex = event.target.getAttribute('mindar-image-target').targetIndex;
                log('🎯 Target detectado: ' + targetIndex);
                
                if (targetIndex === 0) {
                    isTargetDetected = true;
                    controls.style.display = 'flex';
                    status.textContent = 'Selecciona un video';
                }
            });
            
            sceneEl.addEventListener('targetLost', function(event) {
                var targetIndex = event.target.getAttribute('mindar-image-target').targetIndex;
                log('🔍 Target perdido: ' + targetIndex);
                
                if (targetIndex === 0) {
                    isTargetDetected = false;
                    controls.style.display = 'none';
                    status.textContent = 'Apunta al marcador';
                    
                    if (currentVideo) {
                        currentVideo.pause();
                    }
                }
            });
            
            // Play video function
            function playVideo(type) {
                log('▶️ Reproduciendo video: ' + type);
                
                if (!isSystemReady || !isTargetDetected) {
                    status.textContent = 'Primero apunta al marcador';
                    return;
                }
                
                if (currentVideo) {
                    currentVideo.pause();
                }
                
                if (type === 'a') {
                    currentVideo = videoA;
                    currentVideoType = 'a';
                    videoDisplay.setAttribute('src', '#video-a');
                    buttonA.classList.add('selected');
                    buttonB.classList.remove('selected');
                } else {
                    currentVideo = videoB;
                    currentVideoType = 'b';
                    videoDisplay.setAttribute('src', '#video-b');
                    buttonA.classList.remove('selected');
                    buttonB.classList.add('selected');
                }
                
                videoDisplay.setAttribute('visible', 'true');
                currentVideo.currentTime = 0;
                
                currentVideo.play().then(function() {
                    log('✅ Video ' + type + ' reproduciendo');
                    status.textContent = '▶️ Video ' + type.toUpperCase();
                }).catch(function(error) {
                    log('❌ Error play: ' + error.message);
                    status.textContent = '❌ Error al reproducir';
                });
            }
            
            buttonA.addEventListener('click', function() { playVideo('a'); });
            buttonB.addEventListener('click', function() { playVideo('b'); });
            
            log('✅ Sistema inicializado - Listo para iniciar');
        });
    </script>
  </body>
</html>
