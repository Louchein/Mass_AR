<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            text-align: center;
        }

        #debug {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            z-index: 999;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div id="status">Iniciando cámara...</div>
    <div id="debug">Debug: Cargando...</div>

    <a-scene 
        mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 2; autoStart: true"
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <!-- Target 0: Efectos dorados tipo fuegos artificiales -->
        <a-entity mindar-image-target="targetIndex: 0" id="target0">
            
            <!-- Contenedor de partículas doradas -->
            <a-entity id="golden-particles" position="0 0 0" visible="false">
                <!-- Círculo central brillante -->
                <a-sphere 
                    position="0 0.5 0" 
                    radius="0.3" 
                    color="#FFD700" 
                    material="transparent: true; opacity: 0.8; shader: standard; metalness: 0.8; roughness: 0.2"
                    animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 1000">
                </a-sphere>
                
                <!-- Partículas flotantes (esferas pequeñas) -->
                <a-sphere position="0.5 1 0" radius="0.05" color="#FFD700" 
                    animation="property: position; to: 0.8 2 0.3; dir: alternate; loop: true; dur: 1500">
                </a-sphere>
                <a-sphere position="-0.3 0.8 0.2" radius="0.04" color="#FF6B35" 
                    animation="property: position; to: -0.6 1.8 0.5; dir: alternate; loop: true; dur: 1800">
                </a-sphere>
                <a-sphere position="0.2 1.2 -0.3" radius="0.06" color="#FFA500" 
                    animation="property: position; to: 0.4 2.2 -0.6; dir: alternate; loop: true; dur: 1200">
                </a-sphere>
                <a-sphere position="-0.4 0.6 0.4" radius="0.03" color="#FFD700" 
                    animation="property: position; to: -0.8 1.6 0.8; dir: alternate; loop: true; dur: 2000">
                </a-sphere>
                <a-sphere position="0.6 0.9 -0.2" radius="0.05" color="#FF4500" 
                    animation="property: position; to: 1.2 1.9 -0.4; dir: alternate; loop: true; dur: 1600">
                </a-sphere>
                
                <!-- Anillos giratorios -->
                <a-ring 
                    position="0 0.5 0" 
                    radius-inner="0.3" 
                    radius-outer="0.5" 
                    color="#FFD700" 
                    material="transparent: true; opacity: 0.6"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
                </a-ring>
                <a-ring 
                    position="0 0.5 0" 
                    radius-inner="0.5" 
                    radius-outer="0.7" 
                    color="#FF6B35" 
                    material="transparent: true; opacity: 0.4"
                    animation="property: rotation; to: 0 -360 0; loop: true; dur: 4000">
                </a-ring>
            </a-entity>
            
            <!-- Texto flotante -->
            <a-text 
                id="text0"
                value="¡BOLSA VIDA!" 
                position="0 2.5 0" 
                align="center" 
                color="#FFD700"
                scale="2 2 2"
                visible="false"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
            </a-text>
        </a-entity>

        <!-- Target 1: Efectos azules tipo lluvia -->
        <a-entity mindar-image-target="targetIndex: 1" id="target1">
            
            <!-- Contenedor de partículas azules -->
            <a-entity id="blue-particles" position="0 0 0" visible="false">
                <!-- Base central -->
                <a-cylinder 
                    position="0 0.5 0" 
                    radius="0.2" 
                    height="0.1" 
                    color="#00BFFF" 
                    material="transparent: true; opacity: 0.8"
                    animation="property: scale; to: 2 1 2; dir: alternate; loop: true; dur: 2000">
                </a-cylinder>
                
                <!-- Gotitas flotando hacia arriba -->
                <a-sphere position="0.3 0.5 0" radius="0.03" color="#00BFFF" 
                    animation="property: position; to: 0.4 2.5 0.1; loop: true; dur: 3000">
                </a-sphere>
                <a-sphere position="-0.2 0.7 0.3" radius="0.04" color="#4ECDC4" 
                    animation="property: position; to: -0.3 2.7 0.5; loop: true; dur: 3500">
                </a-sphere>
                <a-sphere position="0.5 0.3 -0.2" radius="0.02" color="#45B7D1" 
                    animation="property: position; to: 0.7 2.3 -0.3; loop: true; dur: 2800">
                </a-sphere>
                <a-sphere position="-0.4 0.6 -0.4" radius="0.05" color="#00BFFF" 
                    animation="property: position; to: -0.6 2.6 -0.6; loop: true; dur: 3200">
                </a-sphere>
                <a-sphere position="0.1 0.8 0.4" radius="0.03" color="#4ECDC4" 
                    animation="property: position; to: 0.2 2.8 0.7; loop: true; dur: 2900">
                </a-sphere>
                <a-sphere position="-0.1 0.4 0.1" radius="0.04" color="#45B7D1" 
                    animation="property: position; to: -0.2 2.4 0.2; loop: true; dur: 3100">
                </a-sphere>
                
                <!-- Espiral giratorio -->
                <a-torus 
                    position="0 1 0" 
                    radius="0.4" 
                    radius-tubular="0.05" 
                    color="#00BFFF" 
                    material="transparent: true; opacity: 0.7"
                    animation="property: rotation; to: 360 0 360; loop: true; dur: 5000">
                </a-torus>
            </a-entity>
            
            <!-- Modelo 3D si existe -->
            <a-gltf-model 
                id="model1"
                rotation="90 -90 -90" 
                position="0 0 0" 
                scale="5 5 5" 
                src="./assets/logo.glb" 
                animation-mixer
                visible="false">
            </a-gltf-model>
            
            <!-- Texto flotante -->
            <a-text 
                id="text1"
                value="MASS SOLUTIONS" 
                position="0 3 0" 
                align="center" 
                color="#00BFFF"
                scale="1.5 1.5 1.5"
                visible="false"
                animation="property: position; to: 0 3.5 0; dir: alternate; loop: true; dur: 2000">
            </a-text>
        </a-entity>
    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sceneEl = document.querySelector('a-scene');
            const status = document.getElementById('status');
            const debug = document.getElementById('debug');
            
            let activeTargets = new Set();

            // Elementos para cada target
            const target0Elements = {
                particles: document.getElementById('golden-particles'),
                text: document.getElementById('text0')
            };

            const target1Elements = {
                particles: document.getElementById('blue-particles'),
                text: document.getElementById('text1'),
                model: document.getElementById('model1')
            };

            function updateDebug() {
                debug.innerHTML = `
                    Targets activos: ${Array.from(activeTargets).join(', ')}<br>
                    Estado AR: ${sceneEl.is('arReady') ? 'Listo' : 'Cargando'}<br>
                    Total detectados: ${activeTargets.size}<br>
                    Efectos: Solo A-Frame nativo ✅
                `;
            }

            function updateStatus() {
                if (activeTargets.size === 0) {
                    status.textContent = '📱 Apunta la cámara al QR o ilustración';
                } else if (activeTargets.size === 1) {
                    const target = Array.from(activeTargets)[0];
                    const name = target == 0 ? 'Bolsa Vida' : 'Mass Solutions';
                    status.textContent = `✨ ${name} detectado - ¡Mira los efectos!`;
                } else {
                    status.textContent = `🎉 ¡${activeTargets.size} targets detectados!`;
                }
            }

            // Función para mostrar efectos de un target específico
            function showTargetEffects(targetIndex) {
                console.log(`🎆 Mostrando efectos para target ${targetIndex}`);
                
                if (targetIndex === 0) {
                    // Target 0: Efectos dorados + texto
                    target0Elements.particles.setAttribute('visible', 'true');
                    target0Elements.text.setAttribute('visible', 'true');
                    console.log('✨ Efectos dorados activados');
                    
                } else if (targetIndex === 1) {
                    // Target 1: Efectos azules + modelo + texto
                    target1Elements.particles.setAttribute('visible', 'true');
                    target1Elements.text.setAttribute('visible', 'true');
                    
                    // Mostrar modelo 3D si existe
                    if (target1Elements.model) {
                        target1Elements.model.setAttribute('visible', 'true');
                    }
                    console.log('💧 Efectos azules activados');
                }
            }

            // Función para ocultar efectos de un target específico
            function hideTargetEffects(targetIndex) {
                console.log(`🔄 Ocultando efectos para target ${targetIndex}`);
                
                if (targetIndex === 0) {
                    target0Elements.particles.setAttribute('visible', 'false');
                    target0Elements.text.setAttribute('visible', 'false');
                    
                } else if (targetIndex === 1) {
                    target1Elements.particles.setAttribute('visible', 'false');
                    target1Elements.text.setAttribute('visible', 'false');
                    
                    if (target1Elements.model) {
                        target1Elements.model.setAttribute('visible', 'false');
                    }
                }
            }

            // Eventos de AR
            sceneEl.addEventListener('arReady', (event) => {
                console.log('✅ AR System Ready');
                status.textContent = '🎯 ¡AR listo! Apunta la cámara al QR o ilustración';
                updateDebug();
            });

            sceneEl.addEventListener('arError', (event) => {
                console.error('❌ AR Error:', event.detail);
                status.textContent = '❌ Error de AR - Verifica el archivo targets.mind';
                debug.innerHTML = `ERROR: ${JSON.stringify(event.detail)}`;
            });

            // Eventos de detección de targets
            sceneEl.addEventListener('targetFound', (event) => {
                const targetEl = event.target;
                const targetIndex = targetEl.getAttribute('mindar-image-target').targetIndex;
                
                console.log(`🎯 Target ${targetIndex} encontrado`);
                activeTargets.add(targetIndex);
                
                showTargetEffects(targetIndex);
                updateStatus();
                updateDebug();
            });

            sceneEl.addEventListener('targetLost', (event) => {
                const targetEl = event.target;
                const targetIndex = targetEl.getAttribute('mindar-image-target').targetIndex;
                
                console.log(`📤 Target ${targetIndex} perdido`);
                activeTargets.delete(targetIndex);
                
                hideTargetEffects(targetIndex);
                updateStatus();
                updateDebug();
            });

            // Inicialización
            updateDebug();
            console.log('🚀 Sistema de efectos 3D AR inicializado');
            console.log('📦 Usando solo A-Frame nativo - sin dependencias externas');
        });
    </script>
</body>
</html>
