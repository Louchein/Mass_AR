<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- Particle System Component -->
    <script src="https://cdn.jsdelivr.net/gh/IdeaSpaceVR/aframe-particle-system-component@master/dist/aframe-particle-system-component.min.js"></script>
    <style>
        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            text-align: center;
        }

        #debug {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            z-index: 999;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div id="status">Iniciando cámara...</div>
    <div id="debug">Debug: Cargando...</div>

    <a-scene 
        mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 2; autoStart: true"
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <!-- Target 0: Sistema de partículas doradas (como fuegos artificiales) -->
        <a-entity mindar-image-target="targetIndex: 0" id="target0">
            <!-- Partículas principales -->
            <a-entity 
                id="particles0"
                position="0 0 0"
                particle-system="preset: stars;"
                visible="false">
            </a-entity>
            
            <!-- Texto flotante -->
            <a-text 
                id="text0"
                value="¡BOLSA VIDA!" 
                position="0 1.5 0" 
                align="center" 
                color="#FFD700"
                scale="2 2 2"
                visible="false"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
            </a-text>
        </a-entity>

        <!-- Target 1: Sistema de partículas azules (como lluvia hacia arriba) -->
        <a-entity mindar-image-target="targetIndex: 1" id="target1">
            <!-- Partículas principales -->
            <a-entity 
                id="particles1"
                position="0 0 0"
                particle-system="
                    preset: default;
                    particleCount: 150;
                    type: 1;
                    texture: #particleTexture1;
                    size: 0.3;
                    color: #00BFFF, #4ECDC4, #45B7D1;
                    velocityValue: 0 6 0;
                    velocitySpread: 3 1 3;
                    accelerationValue: 0 -3 0;
                    rotationAngle: 0;
                    rotationAngleSpread: 360;
                    opacity: 0.9, 0.2;
                    blending: 1;
                "
                visible="false">
            </a-entity>
            
            <!-- Modelo 3D (si existe) -->
            <a-gltf-model 
                id="model1"
                rotation="90 -90 -90" 
                position="0 0 0" 
                scale="5 5 5" 
                src="./assets/logo.glb" 
                animation-mixer
                visible="false">
            </a-gltf-model>
            
            <!-- Texto flotante -->
            <a-text 
                id="text1"
                value="MASS SOLUTIONS" 
                position="0 2 0" 
                align="center" 
                color="#00BFFF"
                scale="1.5 1.5 1.5"
                visible="false"
                animation="property: position; to: 0 2.5 0; dir: alternate; loop: true; dur: 2000">
            </a-text>
        </a-entity>

        <!-- Assets para texturas de partículas -->
        <a-assets>
            <!-- Textura circular para partículas doradas -->
            <a-mixin 
                id="particleTexture0"
                geometry="primitive: circle; radius: 0.1"
                material="color: #FFD700; transparent: true; opacity: 0.8">
            </a-mixin>
            
            <!-- Textura para partículas azules -->
            <a-mixin 
                id="particleTexture1"
                geometry="primitive: circle; radius: 0.05"
                material="color: #00BFFF; transparent: true; opacity: 0.9">
            </a-mixin>
        </a-assets>
    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sceneEl = document.querySelector('a-scene');
            const status = document.getElementById('status');
            const debug = document.getElementById('debug');
            
            let activeTargets = new Set();

            // Elementos para cada target
            const target0Elements = {
                particles: document.getElementById('particles0'),
                text: document.getElementById('text0')
            };

            const target1Elements = {
                particles: document.getElementById('particles1'),
                text: document.getElementById('text1'),
                model: document.getElementById('model1')
            };

            function updateDebug() {
                debug.innerHTML = `
                    Targets activos: ${Array.from(activeTargets).join(', ')}<br>
                    Estado AR: ${sceneEl.is('arReady') ? 'Listo' : 'Cargando'}<br>
                    Total detectados: ${activeTargets.size}
                `;
            }

            function updateStatus() {
                if (activeTargets.size === 0) {
                    status.textContent = '📱 Apunta la cámara al QR o ilustración';
                } else if (activeTargets.size === 1) {
                    const target = Array.from(activeTargets)[0];
                    status.textContent = `✨ Target ${target} detectado - ¡Mira las partículas!`;
                } else {
                    status.textContent = `🎉 ¡${activeTargets.size} targets detectados!`;
                }
            }

            // Función para mostrar efectos de un target específico
            function showTargetEffects(targetIndex) {
                console.log(`Mostrando efectos para target ${targetIndex}`);
                
                if (targetIndex === 0) {
                    // Target 0: Partículas doradas + texto
                    target0Elements.particles.setAttribute('visible', 'true');
                    target0Elements.text.setAttribute('visible', 'true');
                    
                    // Reiniciar animación de partículas
                    target0Elements.particles.setAttribute('particle-system', 'enabled', true);
                    
                } else if (targetIndex === 1) {
                    // Target 1: Partículas azules + modelo + texto
                    target1Elements.particles.setAttribute('visible', 'true');
                    target1Elements.text.setAttribute('visible', 'true');
                    
                    // Mostrar modelo 3D si existe
                    if (target1Elements.model) {
                        target1Elements.model.setAttribute('visible', 'true');
                    }
                    
                    // Reiniciar animación de partículas
                    target1Elements.particles.setAttribute('particle-system', 'enabled', true);
                }
            }

            // Función para ocultar efectos de un target específico
            function hideTargetEffects(targetIndex) {
                console.log(`Ocultando efectos para target ${targetIndex}`);
                
                if (targetIndex === 0) {
                    target0Elements.particles.setAttribute('visible', 'false');
                    target0Elements.text.setAttribute('visible', 'false');
                    
                } else if (targetIndex === 1) {
                    target1Elements.particles.setAttribute('visible', 'false');
                    target1Elements.text.setAttribute('visible', 'false');
                    
                    if (target1Elements.model) {
                        target1Elements.model.setAttribute('visible', 'false');
                    }
                }
            }

            // Eventos de AR
            sceneEl.addEventListener('arReady', (event) => {
                console.log('✅ AR System Ready');
                status.textContent = '🎯 ¡AR listo! Apunta la cámara al QR o ilustración';
                updateDebug();
            });

            sceneEl.addEventListener('arError', (event) => {
                console.error('❌ AR Error:', event.detail);
                status.textContent = '❌ Error de AR - Recarga la página';
                debug.innerHTML = `ERROR: ${JSON.stringify(event.detail)}`;
            });

            // Eventos de detección de targets
            sceneEl.addEventListener('targetFound', (event) => {
                const targetEl = event.target;
                const targetIndex = targetEl.getAttribute('mindar-image-target').targetIndex;
                
                console.log(`🎯 Target ${targetIndex} encontrado`);
                activeTargets.add(targetIndex);
                
                showTargetEffects(targetIndex);
                updateStatus();
                updateDebug();
            });

            sceneEl.addEventListener('targetLost', (event) => {
                const targetEl = event.target;
                const targetIndex = targetEl.getAttribute('mindar-image-target').targetIndex;
                
                console.log(`📤 Target ${targetIndex} perdido`);
                activeTargets.delete(targetIndex);
                
                hideTargetEffects(targetIndex);
                updateStatus();
                updateDebug();
            });

            // Inicialización
            updateDebug();
            console.log('🚀 Sistema de partículas AR inicializado');
        });
    </script>
</body>
</html>
