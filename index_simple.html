<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mind AR - Two Targets</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    
    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
      max-width: 80%;
    }

    #debug-info {
      position: fixed;
      bottom: 20px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      z-index: 1000;
      font-family: monospace;
      font-size: 11px;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="status">Apunta la cámara a tus targets</div>
  <div id="debug-info"></div>

  <a-scene 
    mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 2; autoStart: true" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Video 1 para Target 0 -->
      <video 
        id="video1" 
        src="https://pub-7144edff5fe447c598bf93723e3a19d2.r2.dev/Turismo_02_cmprsd.mp4" 
        preload="auto" 
        webkit-playsinline 
        playsinline
        loop
        crossorigin="anonymous">
      </video>
      
      <!-- Video 2 para Target 1 -->
      <video 
        id="video2" 
        src="https://pub-7144edff5fe447c598bf93723e3a19d2.r2.dev/Domus_compressed.mp4" 
        preload="auto" 
        webkit-playsinline 
        playsinline
        loop
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target 0 - Video 1 -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-video 
        id="video-display-1"
        src="#video1" 
        width="2" 
        height="1.104" 
        position="0 0 0" 
        rotation="0 0 0">
      </a-video>
    </a-entity>

    <!-- Target 1 - Video 2 -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-video 
        id="video-display-2"
        src="#video2" 
        width="1.932" 
        height="3.5" 
        position="0 0 0" 
        rotation="0 0 0">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sceneEl = document.querySelector('a-scene');
      const video1 = document.querySelector('#video1');
      const video2 = document.querySelector('#video2');
      const status = document.querySelector('#status');
      const debugInfo = document.querySelector('#debug-info');
      
      let isVideoSystemReady = false;
      let target0Detected = false;
      let target1Detected = false;

      // Función para actualizar debug info
      function updateDebug() {
        if (debugInfo) {
          debugInfo.innerHTML = `
            System Ready: ${isVideoSystemReady}<br>
            Target 0: ${target0Detected ? 'Detected' : 'Lost'}<br>
            Target 1: ${target1Detected ? 'Detected' : 'Lost'}<br>
            Video 1 State: ${video1.paused ? 'Paused' : 'Playing'}<br>
            Video 2 State: ${video2.paused ? 'Paused' : 'Playing'}
          `;
        }
      }

      // Verificar carga de videos
      function checkVideoLoad(video, name) {
        return new Promise((resolve, reject) => {
          console.log(`Checking ${name}:`, video.src);
          
          if (video.readyState >= 3) {
            console.log(`${name} already loaded`);
            resolve();
          } else {
            const onLoad = () => {
              console.log(`${name} loaded successfully`);
              resolve();
            };
            
            const onError = (error) => {
              console.error(`${name} load error:`, error);
              reject(error);
            };
            
            video.addEventListener('canplay', onLoad, { once: true });
            video.addEventListener('loadeddata', onLoad, { once: true });
            video.addEventListener('error', onError, { once: true });
            
            video.load();
          }
        });
      }

      // Inicializar sistema de videos
      function initializeVideoSystem() {
        console.log('Initializing video system...');
        status.textContent = 'Cargando videos...';
        
        Promise.allSettled([
          checkVideoLoad(video1, 'Video 1'),
          checkVideoLoad(video2, 'Video 2')
        ]).then((results) => {
          console.log('Video loading results:', results);
          
          const video1OK = results[0].status === 'fulfilled';
          const video2OK = results[1].status === 'fulfilled';
          
          if (!video1OK && !video2OK) {
            console.error('No videos could be loaded');
            status.textContent = '❌ Error al cargar videos';
            return;
          }
          
          if (!video1OK || !video2OK) {
            console.warn('One video failed to load');
            status.textContent = '⚠️ Un video falló al cargar';
          }
          
          // Intentar desbloquear videos para reproducción
          return Promise.all([
            video1.play().then(() => video1.pause()).catch(e => console.log('Video 1 unlock:', e)),
            video2.play().then(() => video2.pause()).catch(e => console.log('Video 2 unlock:', e))
          ]);
        }).then(() => {
          console.log('Video system ready');
          isVideoSystemReady = true;
          status.textContent = '✅ Videos listos - Apunta a tus targets';
          updateDebug();
        }).catch((error) => {
          console.error('Video system initialization failed:', error);
          status.textContent = '❌ Error al inicializar videos';
        });
      }

      // Evento AR Ready
      sceneEl.addEventListener('arReady', () => {
        console.log('AR System Ready');
        status.textContent = '📷 Cámara lista, cargando videos...';
        initializeVideoSystem();
      });

      // Evento AR Error
      sceneEl.addEventListener('arError', (event) => {
        console.error('AR Error:', event.detail);
        status.textContent = '❌ Error de AR - Recarga la página';
      });

      // Eventos Target 0
      const target0 = document.querySelector('[mindar-image-target="targetIndex: 0"]');
      target0.addEventListener('targetFound', () => {
        console.log('Target 0 Found');
        target0Detected = true;
        status.textContent = '🎬 Target 1 detectado - Reproduciendo video';
        
        video1.play().then(() => {
          console.log('Video 1 playing');
          updateDebug();
        }).catch(error => {
          console.error('Video 1 play error:', error);
          status.textContent = '❌ Error al reproducir video 1';
        });
      });

      target0.addEventListener('targetLost', () => {
        console.log('Target 0 Lost');
        target0Detected = false;
        status.textContent = '📷 Target 1 perdido';
        video1.pause();
        updateDebug();
      });

      // Eventos Target 1
      const target1 = document.querySelector('[mindar-image-target="targetIndex: 1"]');
      target1.addEventListener('targetFound', () => {
        console.log('Target 1 Found');
        target1Detected = true;
        status.textContent = '🎬 Target 2 detectado - Reproduciendo video';
        
        video2.play().then(() => {
          console.log('Video 2 playing');
          updateDebug();
        }).catch(error => {
          console.error('Video 2 play error:', error);
          status.textContent = '❌ Error al reproducir video 2';
        });
      });

      target1.addEventListener('targetLost', () => {
        console.log('Target 1 Lost');
        target1Detected = false;
        status.textContent = '📷 Target 2 perdido';
        video2.pause();
        updateDebug();
      });

      // Eventos de error de videos
      video1.addEventListener('error', (e) => {
        console.error('Video 1 Error:', e);
        console.error('Video 1 error code:', video1.error ? video1.error.code : 'unknown');
      });

      video2.addEventListener('error', (e) => {
        console.error('Video 2 Error:', e);
        console.error('Video 2 error code:', video2.error ? video2.error.code : 'unknown');
      });

      // Mostrar debug info con doble click
      let clickCount = 0;
      document.addEventListener('click', () => {
        clickCount++;
        if (clickCount === 2) {
          debugInfo.style.display = debugInfo.style.display === 'none' ? 'block' : 'none';
          clickCount = 0;
        }
        setTimeout(() => clickCount = 0, 500);
      });
    });
  </script>
</body>
</html>
